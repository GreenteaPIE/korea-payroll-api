name: Publish to npm

# GitHub 에서 Release 를 발행하면 npm 에 korea-payroll 패키지를 배포한다.
# 인증은 npm Trusted Publishing(OIDC)이라 저장소에 npm 토큰이 필요 없다.
# Release 태그는 package.json 의 version 과 같아야 한다 (예: v0.1.0).
# 이미 배포된 버전이면 배포는 건너뛰고, Trusted Publishing 인증이 되는지만 확인한다.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing(토큰 없는 OIDC 배포)은 npm 11.5 이상에서만 동작한다
      - run: npm install -g npm@11
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Release 태그(${{ github.event.release.tag_name }})와 package.json 버전($version)이 다릅니다"
            exit 1
          fi
      - name: Check if this version is already on npm
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version 은 이미 npm 에 있어 배포를 건너뜁니다"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # npm CLI 가 배포할 때 하는 것과 같은 OIDC 토큰 교환을 해 본다 (토큰은 받기만 하고 쓰지 않는다)
      - name: Check Trusted Publishing
        if: steps.check.outputs.published == 'true'
        run: |
          id_token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${{ steps.check.outputs.name }}")
          if [ "$status" != "201" ]; then
            echo "::error::Trusted Publishing 인증 실패 (HTTP $status). npmjs.com 의 Trusted Publisher 설정(저장소·워크플로 파일 이름)을 확인하세요"
            exit 1
          fi
          echo "::notice::Trusted Publishing 인증 확인 (HTTP $status)"
      - if: steps.check.outputs.published != 'true'
        run: npm ci
      # prepublishOnly 가 타입 검사·테스트·빌드를 한다
      - if: steps.check.outputs.published != 'true'
        run: npm publish --provenance --access public
